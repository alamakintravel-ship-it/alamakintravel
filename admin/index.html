<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الإدارة | الأماكن للسفر والسياحة</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#142437;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.panel{background:white;border:1px solid #e2e8ef;border-radius:18px;padding:25px;box-shadow:0 8px 30px #1424370b}.login .panel{width:min(430px,100%)}h1{font-size:24px;margin:0 0 12px}h2{font-size:20px;margin:0 0 16px}p{color:#607186;line-height:1.8}label{display:block;font-size:13px;font-weight:bold;margin:14px 0 7px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px;background:white;color:#142437}textarea{min-height:90px}button{border:0;border-radius:10px;padding:11px 17px}.primary{background:#0b6075;color:white}.secondary{background:#e8eff3;color:#17394c}.danger{background:#fff0ee;color:#a72b25}.small{padding:7px 10px;font-size:13px}.layout{display:flex;min-height:100vh}.sidebar{width:240px;background:#103c4e;color:white;padding:24px 15px;flex-shrink:0}.sidebar h1{font-size:20px;margin-bottom:25px}.nav{display:block;width:100%;text-align:right;background:transparent;color:#d5e7ed;margin:6px 0}.nav.active,.nav:hover{background:#1e5a70;color:white}.main{padding:26px;min-width:0;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}.stat{background:white;padding:20px;border-radius:14px;border:1px solid #e1e8ed}.stat strong{display:block;font-size:28px;margin-top:8px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.table-wrap{width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:690px}th,td{border-bottom:1px solid #edf1f4;text-align:right;padding:12px;font-size:13px;vertical-align:top}th{background:#f4f8fa}td.actions{white-space:nowrap}.muted{color:#6a7988;font-size:13px}.msg{padding:12px;margin:12px 0;border-radius:9px;background:#fff6db;color:#774e00}.success{background:#e4f7e9;color:#226538}.modal{position:fixed;inset:0;background:#0e2437a0;display:grid;place-items:center;padding:18px;z-index:10}.modal>.panel{width:min(700px,100%);max-height:92vh;overflow:auto}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}.full{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.ltr{direction:ltr;text-align:left}@media(max-width:760px){.layout{display:block}.sidebar{width:100%;padding:16px}.sidebar h1{margin-bottom:10px}.nav{display:inline-block;width:auto}.main{padding:14px}.fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="loginView" class="login"><div class="panel"><h1>الأماكن للسفر والسياحة</h1><p>تسجيل الدخول إلى لوحة الإدارة</p><form id="loginForm"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" style="width:100%;margin-top:20px" type="submit">دخول</button></form><div id="loginMessage" role="alert"></div></div></section>
<section id="appView" class="layout hidden"><aside class="sidebar"><h1>✈ الأماكن للسفر والسياحة</h1><button class="nav active" data-section="dashboard">الرئيسية</button><button class="nav" data-section="bookings">الحجوزات</button><button class="nav" data-section="customers">العملاء</button><button class="nav" data-section="destinations">الوجهات السياحية</button><button class="nav" data-section="offers">العروض والباقات</button><button class="nav" data-section="payments">المدفوعات</button></aside><main class="main"><div class="top"><div><h1 id="sectionTitle">لوحة الإدارة</h1><span class="muted" id="signedInEmail"></span></div><button class="secondary" id="logout">تسجيل الخروج</button></div><div id="message" role="status"></div><section id="dashboardView"><div id="stats" class="cards"></div><div class="panel"><h2>إدارة موقعك من مكان واحد</h2><p>اختر القسم من القائمة لإضافة العناصر أو تعديلها. الصور حالياً تُضاف كرابط صورة؛ رفع الصور المباشر نضيفه لاحقاً عبر Supabase Storage.</p></div></section><section id="dataView" class="panel hidden"><div class="toolbar"><h2 id="tableTitle">السجلات</h2><button class="primary" id="addBtn">+ إضافة جديد</button></div><div class="table-wrap"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div><p id="empty" class="muted"></p></section></main></section>
<div id="editorModal" class="modal hidden"><div class="panel"><div class="toolbar"><h2 id="editorTitle">إضافة</h2><button id="closeModal" class="secondary">إغلاق</button></div><form id="editorForm"><div id="editorFields" class="fields"></div><div class="form-actions"><button class="secondary" type="button" id="cancelModal">إلغاء</button><button class="primary" type="submit">حفظ</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const SUPABASE_URL='https://pxvvhqhsbdgpowoffgnt.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_ywB-Sgr0W9j-Hye-Dxk40A_2VfXNkzT';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
const defs={
 bookings:{title:'الحجوزات',fields:{customer_name:['اسم الزبون','text',true],phone:['الهاتف','tel',true],email:['البريد الإلكتروني','email'],travel_date:['تاريخ السفر','date'],guests:['عدد الأشخاص','number'],status:['الحالة','select',false,['pending','confirmed','cancelled','completed']],notes:['ملاحظات','textarea']}},
 customers:{title:'العملاء',fields:{full_name:['الاسم الكامل','text',true],phone:['الهاتف','tel',true],email:['البريد الإلكتروني','email'],notes:['ملاحظات','textarea']}},
 destinations:{title:'الوجهات السياحية',fields:{title:['العنوان','text',true],country:['الدولة','text'],city:['المدينة','text'],description:['الوصف','textarea'],image_url:['رابط الصورة','url'],price:['السعر','number'],currency:['العملة','text'],is_active:['مفعّل','checkbox']}},
 offers:{title:'العروض والباقات',fields:{title:['عنوان العرض','text',true],description:['الوصف','textarea'],destination_id:['معرّف الوجهة UUID (اختياري)','text'],image_url:['رابط الصورة','url'],price:['السعر','number'],currency:['العملة','text'],start_date:['بداية العرض','date'],end_date:['نهاية العرض','date'],is_active:['مفعّل','checkbox']}},
 payments:{title:'المدفوعات',fields:{booking_id:['معرّف الحجز UUID','text',true],amount:['المبلغ','number',true],currency:['العملة','text'],payment_method:['طريقة الدفع','text'],payment_status:['حالة الدفع','select',false,['pending','paid','refunded','failed']],notes:['ملاحظات','textarea']}}
};
let current='dashboard',records=[],editing=null,adminUser=null;
const statuses={pending:'قيد الانتظار',confirmed:'مؤكد',cancelled:'ملغى',completed:'مكتمل',paid:'مدفوع',refunded:'مسترجع',failed:'فشل'};
function message(s,error=false){$('message').innerHTML='';if(!s)return;let d=document.createElement('div');d.className='msg'+(error?'':' success');d.textContent=s;$('message').append(d)}
function loginError(s){$('loginMessage').innerHTML='';if(s){let d=document.createElement('div');d.className='msg';d.textContent=s;$('loginMessage').append(d)}}
async function isAdmin(user){if(!user)return false;const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(error)throw error;return !!data}
async function initialize(){try{const {data:{user},error}=await db.auth.getUser();if(error||!user){showLogin();return}if(!(await isAdmin(user))){await db.auth.signOut();showLogin();loginError('هذا الحساب غير مسجّل كمدير.');return}adminUser=user;$('signedInEmail').textContent=user.email||'';$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');await navigate('dashboard')}catch(e){showLogin();loginError('تعذّر التحقق من صلاحية المدير: '+e.message)}}
function showLogin(){$('appView').classList.add('hidden');$('loginView').classList.remove('hidden')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();loginError('');const btn=e.target.querySelector('button');btn.disabled=true;try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';await initialize()}catch(err){loginError('فشل الدخول: '+err.message)}finally{btn.disabled=false}});
$('logout').addEventListener('click',async()=>{await db.auth.signOut();adminUser=null;showLogin()});
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.section)));
async function navigate(section){current=section;message('');document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.section===section));$('sectionTitle').textContent=section==='dashboard'?'لوحة الإدارة':defs[section].title;$('dashboardView').classList.toggle('hidden',section!=='dashboard');$('dataView').classList.toggle('hidden',section==='dashboard');if(section==='dashboard')await stats();else await loadRows()}
async function stats(){const node=$('stats');node.textContent='جارٍ تحميل الإحصاءات...';try{const keys=Object.keys(defs);const values=await Promise.all(keys.map(k=>db.from(k).select('id',{count:'exact',head:true})));node.innerHTML='';keys.forEach((k,i)=>{let card=document.createElement('div');card.className='stat';let t=document.createElement('span');t.textContent=defs[k].title;let n=document.createElement('strong');n.textContent=values[i].error?'—':values[i].count;card.append(t,n);node.append(card)});if(values.some(x=>x.error))message('بعض الإحصاءات غير متاحة؛ تحقق من بنية الجداول وسياسات RLS.',true)}catch(e){message(e.message,true)}}
async function loadRows(){const def=defs[current];$('tableTitle').textContent=def.title;$('tableBody').innerHTML='';$('tableHead').innerHTML='';$('empty').textContent='جارٍ تحميل البيانات...';const columns=Object.keys(def.fields);try{const {data,error}=await db.from(current).select('*').order('created_at',{ascending:false}).limit(200);if(error)throw error;records=data||[];let hr=document.createElement('tr');[...columns.map(c=>def.fields[c][0]),'الإجراءات'].forEach(h=>{let th=document.createElement('th');th.textContent=h;hr.append(th)});$('tableHead').append(hr);records.forEach(row=>{let tr=document.createElement('tr');columns.forEach(c=>{let td=document.createElement('td');let val=row[c];td.textContent=typeof val==='boolean'?(val?'نعم':'لا'):(statuses[val]||val||'—');tr.append(td)});let td=document.createElement('td');td.className='actions';let edit=document.createElement('button');edit.className='secondary small';edit.textContent='تعديل';edit.addEventListener('click',()=>openEditor(row));let del=document.createElement('button');del.className='danger small';del.style.marginInlineStart='6px';del.textContent='حذف';del.addEventListener('click',()=>deleteRow(row));td.append(edit,del);tr.append(td);$('tableBody').append(tr)});$('empty').textContent=records.length?'يعرض آخر 200 سجل.':'لا توجد سجلات حالياً.'}catch(e){$('empty').textContent='تعذّر تحميل البيانات';message('خطأ في '+current+': '+e.message,true)}}
function openEditor(row=null){editing=row;$('editorTitle').textContent=(row?'تعديل ':'إضافة ')+defs[current].title;$('editorFields').innerHTML='';Object.entries(defs[current].fields).forEach(([key,[label,type,required,options]])=>{let wrap=document.createElement('div');if(type==='textarea')wrap.className='full';let l=document.createElement('label');l.htmlFor='field_'+key;l.textContent=label;let field;if(type==='textarea')field=document.createElement('textarea');else if(type==='select'){field=document.createElement('select');options.forEach(opt=>{let o=document.createElement('option');o.value=opt;o.textContent=statuses[opt]||opt;field.append(o)})}else{field=document.createElement('input');field.type=type; if(type==='number')field.step=key==='guests'?'1':'0.01'}field.id='field_'+key;field.name=key;if(required)field.required=true;if(type==='checkbox')field.checked=row?!!row[key]:true;else field.value=row?.[key]??(key==='currency'?'IQD':key==='status'||key==='payment_status'?'pending':'');wrap.append(l,field);$('editorFields').append(wrap)});$('editorModal').classList.remove('hidden')}
function closeEditor(){$('editorModal').classList.add('hidden');editing=null}
$('addBtn').addEventListener('click',()=>openEditor());$('closeModal').addEventListener('click',closeEditor);$('cancelModal').addEventListener('click',closeEditor);
$('editorForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('[type=submit]');btn.disabled=true;let values={};Object.keys(defs[current].fields).forEach(k=>{let field=$('field_'+k);values[k]=field.type==='checkbox'?field.checked:field.value.trim()===''?null:field.type==='number'?Number(field.value):field.value.trim()});try{let result=editing?await db.from(current).update(values).eq('id',editing.id).select('id'):await db.from(current).insert(values).select('id');if(result.error)throw result.error;if(!result.data?.length)throw new Error('لم تتغير بيانات؛ تحقق من صلاحيات RLS.');closeEditor();await loadRows();message('تم حفظ البيانات بنجاح.')}catch(err){alert('لم يتم الحفظ: '+err.message)}finally{btn.disabled=false}});
async function deleteRow(row){if(!confirm('متأكد من حذف هذا السجل؟ قد يؤثر على السجلات المرتبطة به.'))return;const {data,error}=await db.from(current).delete().eq('id',row.id).select('id');if(error||!data?.length){message('تعذّر الحذف: '+(error?.message||'لا توجد صلاحية أو لم يتغير أي سجل'),true);return}await loadRows();message('تم الحذف بنجاح.')}
initialize();
</script>
</body></html>
